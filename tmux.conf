set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm*:Tc'
set-window-option -g mode-keys vi
set -s escape-time 0
set-option -g history-limit 10000
set-option -g allow-passthrough on
set-option -g update-environment "LC_INSIDE_EMACS INSIDE_EMACS"
set -g renumber-windows on
set -g status-right "#{host} #{pane_current_command} #{?client_prefix,#[bg=red] PREFIX #[default],}"

set -g extended-keys always
bind-key -n S-Space send-keys -l " "
set -as terminal-features ',*:extkeys'

# set -g mouse

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Move window left/right and follow focus; wrap without reordering other windows
bind-key -n C-S-Left if-shell -F '#{window_start_flag}' 'move-window -a -t ":$"' 'swap-window -s : -t :- ; select-window -t :-'
bind-key -n C-S-Right if-shell -F '#{window_end_flag}' 'move-window -b -t :^' 'swap-window -s : -t :+ ; select-window -t :+'

